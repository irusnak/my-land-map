<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Агро-Кадастр — Професійна ГІС Система</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; touch-action: manipulation; }
    #map { height: 100vh; width: 100vw; z-index: 1; background-color: #080c14; }
    
    /* Темне скло для Popup */
    .leaflet-popup-content-wrapper {
      background: rgba(15, 23, 42, 0.96) !important;
      backdrop-filter: blur(20px) saturate(180%) !important;
      -webkit-backdrop-filter: blur(20px) saturate(180%) !important;
      color: #f8fafc !important;
      border-radius: 16px !important;
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8) !important;
      padding: 0 !important;
      overflow: hidden !important;
    }
    .leaflet-popup-content {
      margin: 0 !important;
      width: 320px !important;
      max-width: 85vw !important;
      color: #f8fafc !important;
    }
    .leaflet-popup-tip { 
      background: rgba(15, 23, 42, 0.96) !important;
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
    }

    /* Стиль кружечка з ID паю в центрі полігону */
    .polygon-id-label {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      padding: 0 !important;
    }
    .polygon-id-label::before {
      display: none !important;
    }

    /* Ефекти для полігонів */
    .agro-field-polygon {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      filter: drop-shadow(0px 4px 10px rgba(0, 0, 0, 0.7));
      cursor: pointer;
    }
    .agro-field-polygon:hover {
      filter: drop-shadow(0px 0px 16px rgba(255, 255, 255, 0.9));
    }

    .custom-scroll::-webkit-scrollbar { width: 5px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 5px; }
  </style>
</head>
<body class="m-0 p-0 overflow-hidden bg-slate-950 text-slate-100">

  <!-- SVG Патерни штриховки -->
  <svg style="width:0; height:0; position:absolute;" aria-hidden="true">
    <defs id="svg-patterns"></defs>
  </svg>

  <!-- АВТОРИЗАЦІЯ -->
  <div id="login-modal" class="fixed inset-0 z-[3000] flex items-center justify-center p-4 bg-cover bg-center" style="background-image: url('StockCake-Golden_Fields_Above-1530996-standard.jpg');">
    <div class="absolute inset-0 bg-slate-950/50 backdrop-blur-md"></div>
    <div class="relative z-10 bg-slate-900/85 border border-white/20 rounded-2xl p-8 w-full max-w-md shadow-2xl backdrop-blur-2xl">
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-emerald-500/10 text-emerald-400 mb-4 border border-emerald-500/20 shadow-lg shadow-emerald-500/10 text-2xl">🔒</div>
        <h2 class="text-xl font-bold text-slate-100 tracking-tight">ГІС Агро-Кадастр</h2>
        <p class="text-sm text-slate-300 mt-2">Авторизуйтесь для роботи з масивом полів</p>
      </div>
      <div class="space-y-5">
        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Логін</label>
          <input type="text" id="auth-username" placeholder="admin або user" class="w-full bg-slate-950/80 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-emerald-500 shadow-inner">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Пароль</label>
          <input type="password" id="auth-password" placeholder="••••" class="w-full bg-slate-950/80 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-emerald-500 shadow-inner">
        </div>
        <div id="login-error" class="hidden text-sm text-rose-400 text-center font-medium bg-rose-500/10 py-2 rounded-lg border border-rose-500/20">Невірний логін або пароль!</div>
        <button onclick="handleLogin()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3.5 rounded-xl text-sm transition-all shadow-lg shadow-emerald-500/20 active:scale-95 mt-2">
          Увійти в систему
        </button>
      </div>
    </div>
  </div>

  <!-- КНОПКА ГЕОЛОКАЦІЇ -->
  <button onclick="locateUser()" title="Ваше місцерозташування" class="fixed right-5 bottom-8 z-[1000] bg-white hover:bg-slate-100 text-slate-700 w-12 h-12 rounded-full shadow-2xl border border-slate-200/80 flex items-center justify-center transition-all active:scale-90 group focus:outline-none">
    <svg class="w-6 h-6 text-slate-600 group-hover:text-blue-600 transition-colors" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0 0 13 3.06V1h-2v2.06A8.994 8.994 0 0 0 3.06 11H1v2h2.06A8.994 8.994 0 0 0 11 20.94V23h2v-2.06A8.994 8.994 0 0 0 20.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/>
    </svg>
  </button>

  <!-- ПАНЕЛЬ УПРАВЛІННЯ -->
  <aside id="sidebar" class="fixed top-4 left-4 z-[1000] w-[calc(100vw-32px)] max-w-sm md:w-[360px] bg-slate-900/90 backdrop-blur-2xl text-slate-200 rounded-2xl shadow-2xl border border-white/10 flex flex-col overflow-hidden transition-all duration-300">
    <div onclick="toggleSidebar()" class="p-4 bg-slate-950/80 border-b border-white/10 flex items-center justify-between cursor-pointer select-none group">
      <div class="flex items-center gap-3.5">
        <div class="w-3 h-3 rounded-full bg-emerald-400 ring-4 ring-emerald-500/20 shadow-lg shadow-emerald-500/50"></div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="font-extrabold text-sm uppercase tracking-wider text-slate-50 group-hover:text-emerald-400 transition-colors">АГРО-КАДАСТР</h1>
            <svg id="sidebar-chevron" class="w-4 h-4 text-slate-400 group-hover:text-emerald-400 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path>
            </svg>
          </div>
          <p id="user-role-badge" class="text-xs text-emerald-400/80 font-semibold mt-0.5">Гість</p>
        </div>
      </div>
      <button onclick="event.stopPropagation(); handleLogout()" class="text-xs font-semibold bg-white/5 hover:bg-rose-500/20 hover:text-rose-400 text-slate-300 px-3 py-1.5 rounded-lg border border-white/10 transition-colors">
        Вийти
      </button>
    </div>

    <div id="sidebar-body" class="flex flex-col max-h-[calc(100vh-140px)] transition-all duration-300">
      <!-- ПОШУК -->
      <div class="p-3 bg-black/40 border-b border-white/5">
        <div class="relative flex items-center">
          <input type="text" id="search-input" placeholder="Пошук за № паю, кадастровим, власником..." 
                 onkeyup="if(event.key === 'Enter') performSearch()"
                 class="w-full bg-slate-950/90 border border-white/15 rounded-xl pl-9 pr-16 py-2.5 text-xs text-slate-100 placeholder-slate-400 focus:outline-none focus:border-emerald-500 shadow-inner">
          <svg class="w-4 h-4 text-slate-400 absolute left-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
          <button onclick="performSearch()" class="absolute right-2 text-xs bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold px-2.5 py-1 rounded-lg transition-colors">
            Шукати
          </button>
        </div>
      </div>

      <!-- АНАЛІТИКА -->
      <div class="grid grid-cols-2 gap-3 p-4 bg-black/20 border-b border-white/5 text-center">
        <div class="bg-slate-950/60 p-3 rounded-xl border border-white/5 shadow-inner">
          <span class="block text-[10px] uppercase font-bold text-slate-400 tracking-wider mb-1">Відображено полів</span>
          <span id="stat-count" class="text-xl font-extrabold text-slate-100">0</span>
        </div>
        <div class="bg-slate-950/60 p-3 rounded-xl border border-white/5 shadow-inner">
          <span class="block text-[10px] uppercase font-bold text-slate-400 tracking-wider mb-1">Загальна площа</span>
          <span id="stat-area" class="text-xl font-extrabold text-emerald-400">0.00 га</span>
        </div>
      </div>

      <!-- ФІЛЬТРИ -->
      <div class="p-4 space-y-5 overflow-y-auto custom-scroll flex-1">
        <!-- Фільтр Культури -->
        <div>
          <div class="flex items-center justify-between mb-3 px-1">
            <span class="text-xs font-bold uppercase text-slate-400 tracking-wider">🌾 Культури (crop)</span>
            <button onclick="toggleGroup('crop', true)" class="text-xs text-emerald-400 hover:text-emerald-300 font-bold px-2 py-1 bg-emerald-500/10 rounded-md">Всі</button>
          </div>
          <div id="crop-filters" class="space-y-2"></div>
        </div>

        <div class="border-t border-white/5"></div>

        <!-- Фільтр Орендарі -->
        <div>
          <div class="flex items-center justify-between mb-3 px-1">
            <span class="text-xs font-bold uppercase text-slate-400 tracking-wider">🏢 Орендарі (area_ha)</span>
            <button onclick="toggleGroup('tenant', true)" class="text-xs text-emerald-400 hover:text-emerald-300 font-bold px-2 py-1 bg-emerald-500/10 rounded-md">Всі</button>
          </div>
          <div id="tenant-filters" class="space-y-2"></div>
        </div>
      </div>
    </div>
  </aside>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = 'https://nwojstekgkmlrebpsbxl.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_EKyY2G-Rj-AiDpJsP8q7Sw_NDuMtmf6';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUserRole = localStorage.getItem('user_role') || null;
    let userLocationMarker = null;

    function toggleSidebar() {
      document.getElementById('sidebar-body').classList.toggle('hidden');
      document.getElementById('sidebar-chevron').classList.toggle('rotate-180');
    }

    function checkAuth() {
      if (!currentUserRole) {
        document.getElementById('login-modal').classList.remove('hidden');
      } else {
        document.getElementById('login-modal').classList.add('hidden');
        document.getElementById('user-role-badge').innerText = currentUserRole === 'admin' ? 'Адміністратор' : 'Переглядач';
      }
    }

    function handleLogin() {
      const u = document.getElementById('auth-username').value.trim();
      const p = document.getElementById('auth-password').value.trim();
      const err = document.getElementById('login-error');

      if (u === 'admin' && p === '8878') currentUserRole = 'admin';
      else if (u === 'user' && p === '1111') currentUserRole = 'user';
      else { err.classList.remove('hidden'); return; }

      err.classList.add('hidden');
      localStorage.setItem('user_role', currentUserRole);
      checkAuth();
      renderMap();
    }

    function handleLogout() {
      localStorage.removeItem('user_role');
      currentUserRole = null;
      checkAuth();
    }

    const map = L.map('map', { zoomControl: false }).setView([48.3, 25.9], 13);
    L.control.zoom({ position: 'topright' }).addTo(map);

    const basemaps = {
      "Google Супутник": L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { maxZoom: 20 }),
      "OpenStreetMap": L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 })
    };
    basemaps["Google Супутник"].addTo(map);
    L.control.layers(basemaps, null, { position: 'topright' }).addTo(map);

    function locateUser() {
      if (!navigator.geolocation) return alert('Геолокація не підтримується');
      navigator.geolocation.getCurrentPosition(pos => {
        const { latitude, longitude } = pos.coords;
        if (userLocationMarker) map.removeLayer(userLocationMarker);
        userLocationMarker = L.circleMarker([latitude, longitude], {
          radius: 8, fillColor: '#1A73E8', color: '#FFFFFF', weight: 3, opacity: 1, fillOpacity: 1
        }).addTo(map).bindPopup('<b>Ви тут</b>').openPopup();
        map.setView([latitude, longitude], 17);
      });
    }

    // Палітра кольорів
    const cropColors = {
      'соняшник': '#E2A854',  
      'кукурудза': '#7A9A60',  
      'гречка': '#5E8C6A',     
      'помідор': '#C66858',    
      'малина': '#B85B74',     
      'пшениця': '#D9C583',    
      'просо': '#CBB778',      
      'батат': '#A8795A',      
      'ріпак': '#E0BD4E',      
      'соя': '#488B77'         
    };

    const tenantColors = {};
    const defaultPalette = ['#60A5FA', '#F472B6', '#34D399', '#FB923C', '#A78BFA', '#38BDF8'];
    let tenantIdx = 0;

    function getTenantColor(tenant) {
      if (!tenant || tenant === '—') return '#94A3B8';
      if (!tenantColors[tenant]) {
        tenantColors[tenant] = defaultPalette[tenantIdx % defaultPalette.length];
        tenantIdx++;
      }
      return tenantColors[tenant];
    }

    function generateSVGPatterns() {
      const defs = document.getElementById('svg-patterns');
      defs.innerHTML = '';
      Object.entries(cropColors).forEach(([crop, color]) => {
        const safeId = crop.replace(/\s+/g, '-');
        const pattern = document.createElementNS('http://www.w3.org/2000/svg', 'pattern');
        pattern.setAttribute('id', `stripe-${safeId}`);
        pattern.setAttribute('patternUnits', 'userSpaceOnUse');
        pattern.setAttribute('width', '12');
        pattern.setAttribute('height', '12');
        pattern.setAttribute('patternTransform', 'rotate(45)');

        const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        bg.setAttribute('width', '12'); bg.setAttribute('height', '12');
        bg.setAttribute('fill', color); bg.setAttribute('fill-opacity', '0.25'); 

        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', '0'); line.setAttribute('y1', '0'); line.setAttribute('x2', '0'); line.setAttribute('y2', '12');
        line.setAttribute('stroke', color); line.setAttribute('stroke-width', '4'); line.setAttribute('stroke-opacity', '0.8');

        pattern.appendChild(bg); pattern.appendChild(line); defs.appendChild(pattern);
      });
    }

    let rawGeoJson = null;
    let geojsonLayer = null;
    let activeCrops = new Set();
    let activeTenants = new Set();

    async function initApp() {
      generateSVGPatterns();
      checkAuth();
      const { data, error } = await supabaseClient.rpc('get_fields_geojson');
      if (error) return console.error('Помилка завантаження даних:', error);

      rawGeoJson = data;
      rebuildFilterValues();
      renderControls();
      renderMap();
    }

    function rebuildFilterValues() {
      activeCrops.clear();
      activeTenants.clear();
      rawGeoJson.features.forEach(f => {
        const crop = (f.properties.crop || 'інше').toLowerCase().trim();
        const tenant = (f.properties.area_ha || '—').trim(); // area_ha це орендар
        activeCrops.add(crop);
        activeTenants.add(tenant);
      });
    }

    function renderControls() {
      const cropBox = document.getElementById('crop-filters');
      const tenantBox = document.getElementById('tenant-filters');
      cropBox.innerHTML = '';
      tenantBox.innerHTML = '';

      activeCrops.forEach(crop => {
        const color = cropColors[crop] || '#8B93A0';
        const stripeBg = `repeating-linear-gradient(45deg, ${color}40, ${color}40 3px, ${color}CC 3px, ${color}CC 6px)`;
        const label = document.createElement('label');
        label.className = 'flex items-center justify-between p-2.5 rounded-xl bg-slate-950/50 hover:bg-white/5 border border-white/5 cursor-pointer text-xs transition-all';
        label.innerHTML = `
          <div class="flex items-center gap-2.5">
            <input type="checkbox" value="${crop}" data-group="crop" checked class="w-4 h-4 text-emerald-500 rounded bg-slate-900 border-white/20">
            <span class="w-4 h-4 rounded border border-white/20" style="background: ${stripeBg};"></span>
            <span class="capitalize font-medium text-slate-200">${crop}</span>
          </div>
        `;
        cropBox.appendChild(label);
      });

      activeTenants.forEach(tenant => {
        const color = getTenantColor(tenant);
        const label = document.createElement('label');
        label.className = 'flex items-center justify-between p-2.5 rounded-xl bg-slate-950/50 hover:bg-white/5 border border-white/5 cursor-pointer text-xs transition-all';
        label.innerHTML = `
          <div class="flex items-center gap-2.5">
            <input type="checkbox" value="${tenant}" data-group="tenant" checked class="w-4 h-4 text-emerald-500 rounded bg-slate-900 border-white/20">
            <span class="w-4 h-1.5 rounded-full" style="background-color: ${color}; box-shadow: 0 0 6px ${color};"></span>
            <span class="font-medium text-slate-200 truncate max-w-[200px]" title="${tenant}">${tenant}</span>
          </div>
        `;
        tenantBox.appendChild(label);
      });

      document.querySelectorAll('input[data-group]').forEach(cb => cb.addEventListener('change', syncFiltersAndRender));
    }

    function syncFiltersAndRender() {
      activeCrops.clear();
      activeTenants.clear();
      document.querySelectorAll('input[data-group="crop"]:checked').forEach(cb => activeCrops.add(cb.value));
      document.querySelectorAll('input[data-group="tenant"]:checked').forEach(cb => activeTenants.add(cb.value));
      renderMap();
    }

    function toggleGroup(group, check) {
      document.querySelectorAll(`input[data-group="${group}"]`).forEach(cb => cb.checked = check);
      syncFiltersAndRender();
    }

    function performSearch() {
      const query = document.getElementById('search-input').value.trim().toLowerCase();
      if (!query) return;

      let foundLayer = null;

      geojsonLayer.eachLayer(layer => {
        const p = layer.feature.properties;
        const cadnum = (p.cadnum || '').toString().toLowerCase();
        const id = (p.id || '').toString().toLowerCase();
        const owner = (p.owner || '').toString().toLowerCase();
        const tenant = (p.area_ha || '').toString().toLowerCase();

        if (cadnum.includes(query) || id === query || owner.includes(query) || tenant.includes(query)) {
          foundLayer = layer;
        }
      });

      if (foundLayer) {
        map.fitBounds(foundLayer.getBounds(), { maxZoom: 18, animate: true, padding: [50, 50] });
        foundLayer.openPopup();
      } else {
        alert('Ділянку не знайдено!');
      }
    }

    function renderMap() {
      if (geojsonLayer) map.removeLayer(geojsonLayer);

      let visibleCount = 0;
      let totalArea = 0;

      geojsonLayer = L.geoJSON(rawGeoJson, {
        filter: (feature) => {
          const crop = (feature.properties.crop || 'інше').toLowerCase().trim();
          const tenant = (feature.properties.area_ha || '—').trim();
          return activeCrops.has(crop) && activeTenants.has(tenant);
        },
        style: (feature) => {
          const crop = (feature.properties.crop || 'інше').toLowerCase().trim();
          const tenant = (feature.properties.area_ha || '—').trim();
          const safeId = crop.replace(/\s+/g, '-');
          
          const fillStyle = cropColors[crop] ? `url(#stripe-${safeId})` : '#8B93A0';
          const strokeColor = getTenantColor(tenant);

          return {
            fillColor: fillStyle,
            fillOpacity: 1,
            color: strokeColor,
            weight: 2,
            opacity: 1,
            className: 'agro-field-polygon'
          };
        },
        onEachFeature: (feature, layer) => {
          visibleCount++;
          const p = feature.properties;
          const areaNum = parseFloat(p.Площа) || parseFloat(p.area) || 0;
          totalArea += areaNum;

          // Відображення кружечка з ID паю посередині полігону
          if (p.id) {
            layer.bindTooltip(`
              <div style="
                background: rgba(15, 23, 42, 0.9);
                color: #34d399;
                border: 2px solid #10b981;
                border-radius: 50%;
                width: 28px;
                height: 28px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 11px;
                font-weight: 800;
                box-shadow: 0 4px 10px rgba(0,0,0,0.5);
              ">
                ${p.id}
              </div>
            `, {
              permanent: true,
              direction: 'center',
              className: 'polygon-id-label'
            });
          }

          layer.on({
            mouseover: (e) => { e.target.setStyle({ weight: 4, color: '#FFFFFF' }); },
            mouseout: (e) => { geojsonLayer.resetStyle(e.target); }
          });

          layer.bindPopup(() => getPopupHTML(p, areaNum), { maxWidth: 340 });
        }
      }).addTo(map);

      document.getElementById('stat-count').innerText = visibleCount;
      document.getElementById('stat-area').innerText = totalArea.toFixed(2) + ' га';
    }

    function getPopupHTML(p, areaNum) {
      const cadnum = p.cadnum || 'Кадастровий номер не вказано';
      const id = p.id || 'б/н';
      const tenant = p.area_ha || 'Не вказано'; // area_ha
      const crop = (p.crop || 'не вказано').toLowerCase().trim();
      const owner = p.owner || 'Не вказано';
      const address = p.address || 'Адреса не вказана';
      
      const strokeColor = getTenantColor(tenant);
      const cropColor = cropColors[crop] || '#8B93A0';

      return `
        <div style="font-family: 'Plus Jakarta Sans', sans-serif;" onclick="event.stopPropagation()">
          
          <!-- САМИЙ ВЕРХ: Кадастровий номер -->
          <div style="background: rgba(255,255,255,0.06); padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,0.1);">
            <div style="font-size: 9px; font-weight: 800; color: #94a3b8; text-transform: uppercase; tracking-wide: 0.05em;">Кадастровий номер (cadnum)</div>
            <div style="font-weight: 800; font-size: 12px; color: #38bdf8; font-mono: true; margin-top: 2px;">${cadnum}</div>
          </div>

          <!-- Під Кадастровим: ID Паю та Культура -->
          <div style="padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.2);">
            <div style="display: flex; align-items: center; gap: 8px;">
              <span style="background: #10b981; color: #022c22; font-weight: 800; font-size: 11px; padding: 2px 8px; border-radius: 6px;">Пай № ${id}</span>
            </div>
            <span style="background: repeating-linear-gradient(45deg, ${cropColor}80, ${cropColor}80 3px, ${cropColor} 3px, ${cropColor} 6px); color: #ffffff; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; text-transform: capitalize; border: 1px solid rgba(255,255,255,0.2);">
              ${crop}
            </span>
          </div>

          <!-- ОСНОВНА ІНФОРМАЦІЯ -->
          <div style="padding: 14px; font-size: 12px; line-height: 1.6; color: #cbd5e1;">
            
            <!-- Власник (owner) -->
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 6px;">
              <span style="color: #94a3b8; font-weight: 500; min-width: 70px;">Власник:</span>
              <span style="font-weight: 700; color: #f8fafc; text-align: right;">${owner}</span>
            </div>

            <!-- Орендар (area_ha) -->
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 6px;">
              <span style="color: #94a3b8; font-weight: 500; min-width: 70px;">Орендар:</span>
              <span style="font-weight: 700; color: #f8fafc; text-align: right; display: flex; align-items: center; gap: 6px;">
                <span style="width: 8px; height: 8px; border-radius: 50%; background-color: ${strokeColor}; display: inline-block;"></span>
                ${tenant}
              </span>
            </div>

            <!-- Культура (crop) -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 6px;">
              <span style="color: #94a3b8; font-weight: 500;">Культура:</span>
              <span style="font-weight: 700; color: #f8fafc; text-transform: capitalize;">${crop}</span>
            </div>

            <!-- Площа -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 6px;">
              <span style="color: #94a3b8; font-weight: 500;">Площа:</span>
              <span style="font-weight: 800; color: #34d399; font-size: 13px;">${areaNum.toFixed(4)} га</span>
            </div>

            <!-- Адреса (address) -->
            <div style="margin-top: 8px; background: rgba(0,0,0,0.3); padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05);">
              <div style="font-size: 10px; font-weight: 700; color: #94a3b8; text-transform: uppercase; margin-bottom: 2px;">Адреса ділянки:</div>
              <div style="font-size: 11px; color: #e2e8f0; line-height: 1.3;">${address}</div>
            </div>

          </div>
        </div>
      `;
    }

    initApp();
  </script>
</body>
</html>
